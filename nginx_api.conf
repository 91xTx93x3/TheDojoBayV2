# API Subdomain Configuration
# After DNS is configured, use this for production

upstream dojobay_api_backend {
    server 127.0.0.1:8090;
    keepalive 32;
}

# Rate limiting (add to http context in /etc/nginx/nginx.conf if not present)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.dojobay.pw;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dojobay.pw;

    ssl_certificate /etc/letsencrypt/live/api.dojobay.pw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dojobay.pw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/api.dojobay.pw_access.log;
    error_log /var/log/nginx/api.dojobay.pw_error.log;

    # API Proxy
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://dojobay_api_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health Check
    location /health {
        access_log off;
        proxy_pass http://dojobay_api_backend/health;
    }
}
