name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            APP_DIR="$(systemctl show dojobay.service --property=WorkingDirectory --value)"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/.git" ]; then
              MAIN_PID="$(systemctl show dojobay.service --property=MainPID --value)"
              APP_DIR="$(readlink -f "/proc/${MAIN_PID}/cwd")"
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/.git" ]; then
              APP_DIR="/root/dojobay"
            fi

            echo "Deploying to runtime directory: $APP_DIR"
            git -C "$APP_DIR" fetch origin main
            RELEASE_ARCHIVE="$(mktemp)"
            trap 'rm -f "$RELEASE_ARCHIVE"' EXIT
            git -C "$APP_DIR" archive --format=tar origin/main -o "$RELEASE_ARCHIVE"
            tar -xf "$RELEASE_ARCHIVE" -C "$APP_DIR" \
              --exclude='.secret_key' \
              --exclude='dojos_data.json' \
              --exclude='dojo_submissions.json' \
              --exclude='status_cache.json' \
              --exclude='uptime_history.json' \
              --exclude='static/images/qr'

            cd "$APP_DIR"
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart dojobay.service
            sudo systemctl restart dojobay-api.service

            for attempt in 1 2 3 4 5 6; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' -d '{}' \
                https://dojobay.pw/api/pairing-signing-message)"
              if [ "$status" = "401" ]; then
                echo "Production verification succeeded"
                exit 0
              fi
              echo "Production returned HTTP $status; retrying..."
              sleep 5
            done

            echo "Production verification failed"
            exit 1
