name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            APP_DIR="$(systemctl show dojobay.service --property=WorkingDirectory --value)"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/.git" ]; then
              MAIN_PID="$(systemctl show dojobay.service --property=MainPID --value)"
              APP_DIR="$(readlink -f "/proc/${MAIN_PID}/cwd")"
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/.git" ]; then
              APP_DIR="/root/dojobay"
            fi

            echo "Deploying to runtime directory: $APP_DIR"
            git -C "$APP_DIR" fetch origin main
            RELEASE_ARCHIVE="$(mktemp)"
            RELEASE_DATA="$(mktemp)"
            trap 'rm -f "$RELEASE_ARCHIVE" "$RELEASE_DATA"' EXIT
            git -C "$APP_DIR" archive --format=tar origin/main -o "$RELEASE_ARCHIVE"
            git -C "$APP_DIR" show origin/main:dojos_data.json > "$RELEASE_DATA"
            tar -xf "$RELEASE_ARCHIVE" -C "$APP_DIR" \
              --exclude='.secret_key' \
              --exclude='dojos_data.json' \
              --exclude='dojo_submissions.json' \
              --exclude='status_cache.json' \
              --exclude='uptime_history.json' \
              --exclude='static/images/qr'

            cd "$APP_DIR"
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python - "$APP_DIR" "$RELEASE_DATA" <<'PY'
            import json
            import sys
            from pathlib import Path

            app_dir = Path(sys.argv[1]).resolve()
            release_data_path = Path(sys.argv[2])
            removed_names = {"91xTx93x3 Green", "91xTx93x3 Green Testnet"}
            files_to_delete = set()

            def remove_entries(entries):
                kept = []
                for entry in entries:
                    if entry.get("name") in removed_names:
                        image = entry.get("image", "").lstrip("/")
                        if image:
                            files_to_delete.add(app_dir / image)
                    else:
                        kept.append(entry)
                return kept

            data_path = app_dir / "dojos_data.json"
            with data_path.open() as source:
                dojo_data = json.load(source)
            dojo_data["mainnet"] = remove_entries(dojo_data.get("mainnet", []))
            with release_data_path.open() as source:
                release_data = json.load(source)
            green_testnet = next(
                entry for entry in release_data.get("testnet", [])
                if entry.get("name") == "91xTx93x3 Green"
            )
            dojo_data["testnet"] = [
                entry for entry in dojo_data.get("testnet", [])
                if entry.get("name") != "91xTx93x3 Green"
            ]
            dojo_data["testnet"].append(green_testnet)
            with data_path.open("w") as destination:
                json.dump(dojo_data, destination, indent=2, ensure_ascii=False)

            submissions_path = app_dir / "dojo_submissions.json"
            with submissions_path.open() as source:
                submissions = json.load(source)
            green_submission_id = "c422b6a1-0000-4000-8000-000000000000"
            if not any(entry.get("id") == green_submission_id for entry in submissions):
                submissions.append({
                    "id": green_submission_id,
                    "paynym": green_testnet["payment_code"],
                    "paynym_alias": "+91xTx93x3",
                    "name": green_testnet["name"],
                    "network": "testnet",
                    "jurisdiction": green_testnet["jurisdiction"],
                    "hardware": green_testnet["hardware"],
                    "nostr_x": "",
                    "pairing_details": green_testnet["pairing_details"],
                    "pairing_signature": green_testnet["signature"],
                    "pairing_signature_scheme": green_testnet["pairing_signature_scheme"],
                    "electrum_server": green_testnet["electrum_server"],
                    "image_file": None,
                    "qr_filename": Path(green_testnet["image"]).name,
                    "submitted_at": "2026-08-09T00:00:00+02:00",
                    "updated_at": "2026-08-14T16:27:20+02:00",
                    "status": "approved",
                })
                with submissions_path.open("w") as destination:
                    json.dump(submissions, destination, indent=2, ensure_ascii=False)

            cache_path = app_dir / "status_cache.json"
            if cache_path.exists():
                with cache_path.open() as source:
                    cache_payload = json.load(source)
                cache_data = cache_payload.get("data", cache_payload)
                cache_data["mainnet"] = remove_entries(cache_data.get("mainnet", []))
                cache_data["testnet"] = [
                    entry for entry in cache_data.get("testnet", [])
                    if entry.get("name") != "91xTx93x3 Green"
                ]
                stats = cache_data.get("stats")
                if isinstance(stats, dict):
                    for network in ("mainnet", "testnet"):
                        stats[f"{network}_total"] = len(cache_data[network])
                        stats[f"{network}_active"] = sum(
                            entry.get("status") == "Active"
                            for entry in cache_data[network]
                        )
                with cache_path.open("w") as destination:
                    json.dump(cache_payload, destination, indent=2, ensure_ascii=False)

            for path in files_to_delete:
                resolved = path.resolve()
                if resolved.is_relative_to(app_dir):
                    resolved.unlink(missing_ok=True)

            print("Kept Green on testnet and removed it from mainnet")
            PY
            mkdir -p "$APP_DIR/static/images/qr"
            git -C "$APP_DIR" show \
              origin/main:static/images/qr/91xTx93x3_Green_c422b6a1.png \
              > "$APP_DIR/static/images/qr/91xTx93x3_Green_c422b6a1.png"
            sudo systemctl restart dojobay.service
            sudo systemctl restart dojobay-api.service

            for attempt in 1 2 3 4 5 6; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' -d '{}' \
                https://dojobay.pw/api/pairing-signing-message)"
              if [ "$status" = "401" ]; then
                echo "Production verification succeeded"
                exit 0
              fi
              echo "Production returned HTTP $status; retrying..."
              sleep 5
            done

            echo "Production verification failed"
            exit 1
