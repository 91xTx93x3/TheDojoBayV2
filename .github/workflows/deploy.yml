name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            APP_DIR="$(systemctl show dojobay.service --property=WorkingDirectory --value)"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/.git" ]; then
              MAIN_PID="$(systemctl show dojobay.service --property=MainPID --value)"
              APP_DIR="$(readlink -f "/proc/${MAIN_PID}/cwd")"
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/.git" ]; then
              APP_DIR="/root/dojobay"
            fi

            echo "Deploying to runtime directory: $APP_DIR"
            git -C "$APP_DIR" fetch origin main
            RELEASE_ARCHIVE="$(mktemp)"
            RELEASE_DATA="$(mktemp)"
            trap 'rm -f "$RELEASE_ARCHIVE" "$RELEASE_DATA"' EXIT
            git -C "$APP_DIR" archive --format=tar origin/main -o "$RELEASE_ARCHIVE"
            git -C "$APP_DIR" show origin/main:dojos_data.json > "$RELEASE_DATA"
            tar -xf "$RELEASE_ARCHIVE" -C "$APP_DIR" \
              --exclude='.secret_key' \
              --exclude='dojos_data.json' \
              --exclude='dojo_submissions.json' \
              --exclude='status_cache.json'

            cd "$APP_DIR"
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python - "$APP_DIR" <<'PY'
            import json
            import sys
            from pathlib import Path

            app_dir = Path(sys.argv[1]).resolve()
            removed_names = {
                "91xTx93x3 Green",
                "91xTx93x3 Green Testnet",
            }
            files_to_delete = set()

            data_path = app_dir / "dojos_data.json"
            with data_path.open() as source:
                dojo_data = json.load(source)
            for network in ("mainnet", "testnet"):
                kept = []
                for entry in dojo_data.get(network, []):
                    if entry.get("name") in removed_names:
                        image = entry.get("image", "").lstrip("/")
                        if image:
                            files_to_delete.add(app_dir / image)
                    else:
                        kept.append(entry)
                dojo_data[network] = kept
            with data_path.open("w") as destination:
                json.dump(dojo_data, destination, indent=2, ensure_ascii=False)

            submissions_path = app_dir / "dojo_submissions.json"
            if submissions_path.exists():
                with submissions_path.open() as source:
                    submissions = json.load(source)
                kept = []
                for entry in submissions:
                    if entry.get("name") in removed_names:
                        if entry.get("image_file"):
                            files_to_delete.add(
                                app_dir / "static" / "images" / "dojos" / entry["image_file"]
                            )
                        if entry.get("qr_filename"):
                            files_to_delete.add(
                                app_dir / "static" / "images" / "qr" / entry["qr_filename"]
                            )
                    else:
                        kept.append(entry)
                with submissions_path.open("w") as destination:
                    json.dump(kept, destination, indent=2, ensure_ascii=False)

            cache_path = app_dir / "status_cache.json"
            if cache_path.exists():
                with cache_path.open() as source:
                    cache_data = json.load(source)
                for network in ("mainnet", "testnet"):
                    cache_data[network] = [
                        entry for entry in cache_data.get(network, [])
                        if entry.get("name") not in removed_names
                    ]
                stats = cache_data.setdefault("stats", {})
                for network in ("mainnet", "testnet"):
                    stats[f"{network}_total"] = len(cache_data[network])
                    stats[f"{network}_active"] = sum(
                        entry.get("status") == "Active"
                        for entry in cache_data[network]
                    )
                with cache_path.open("w") as destination:
                    json.dump(cache_data, destination, indent=2, ensure_ascii=False)

            qr_dir = app_dir / "static" / "images" / "qr"
            for pattern in ("91xTx93x3_Green_*", "91xTx93x3_Green_Testnet_*"):
                files_to_delete.update(qr_dir.glob(pattern))
            for path in files_to_delete:
                resolved = path.resolve()
                if resolved.is_relative_to(app_dir):
                    resolved.unlink(missing_ok=True)

            print("Removed all Green node records and associated images")
            PY
            python - "$RELEASE_DATA" "$APP_DIR/dojos_data.json" <<'PY'
            import json
            import sys

            release_path, runtime_path = sys.argv[1:]
            with open(release_path) as source:
                release_data = json.load(source)
            with open(runtime_path) as source:
                runtime_data = json.load(source)

            added = []
            for network in ("mainnet", "testnet"):
                runtime_entries = runtime_data.setdefault(network, [])
                existing_names = {entry.get("name") for entry in runtime_entries}
                for entry in release_data.get(network, []):
                    if entry.get("name") not in existing_names:
                        runtime_entries.append(entry)
                        existing_names.add(entry.get("name"))
                        added.append(f"{network}:{entry.get('name')}")

            if added:
                with open(runtime_path, "w") as destination:
                    json.dump(runtime_data, destination, indent=2, ensure_ascii=False)
                print("Added repository nodes:", ", ".join(added))
            else:
                print("No repository nodes needed synchronization")
            PY

            sudo systemctl restart dojobay.service
            sudo systemctl restart dojobay-api.service

            for attempt in 1 2 3 4 5 6; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' -d '{}' \
                https://dojobay.pw/api/pairing-signing-message)"
              if [ "$status" = "401" ]; then
                echo "Production verification succeeded"
                exit 0
              fi
              echo "Production returned HTTP $status; retrying..."
              sleep 5
            done

            echo "Production verification failed"
            exit 1
