<!doctype html>
<html lang="en">
  <head>
    <link rel="shortcut icon" href="/static/images/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/images/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="The Dojo Bay" />
    <link rel="manifest" href="/static/images/favicon/site.webmanifest" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}The Dojo Bay - Public Dojo Directory{% endblock %}
    </title>
    <meta
      name="description"
      content="{% block description %}Find and connect to public Bitcoin Dojo nodes. The Dojo Bay provides a directory of mainnet and testnet dojos for Samourai and Ashigaru wallets.{% endblock %}"
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:url" content="https://dojobay.pw" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="{% block og_title %}The Dojo Bay - Public Dojo Directory{% endblock %}"
    />
    <meta
      property="og:description"
      content="{% block og_description %}Find and connect to public Bitcoin Dojo nodes{% endblock %}"
    />
    <meta
      property="og:image"
      content="https://dojobay.pw/static/images/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="dojobay.pw" />
    <meta property="twitter:url" content="https://dojobay.pw" />
    <meta
      name="twitter:title"
      content="{% block twitter_title %}The Dojo Bay - Public Dojo Directory{% endblock %}"
    />
    <meta
      name="twitter:description"
      content="{% block twitter_description %}Find and connect to public Bitcoin Dojo nodes{% endblock %}"
    />
    <meta
      name="twitter:image"
      content="https://dojobay.pw/static/images/social-card.png"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      :root {
          --primary: #e74c3c;
          --primary-dark: #c0392b;
          --primary-light: #ec7063;
          --dark-bg: #1e1e1e;
          --card-bg: #2a2a2a;
          --card-hover: #353535;
          --border: #444;
          --text-muted: #aaa;
          --text-primary: #e0e0e0;
      }

      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          background-color: var(--dark-bg);
          color: var(--text-primary);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
          line-height: 1.6;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
          color: #ffffff;
      }

      p {
          color: var(--text-primary);
      }

      .navbar {
          background-color: #1a1a1a !important;
          border-bottom: 2px solid var(--primary);
          padding: 1rem 0;
      }

      .navbar-brand {
          color: var(--primary) !important;
          font-weight: 700;
          font-size: 1.75rem;
          letter-spacing: -0.5px;
      }

      .navbar-brand:hover {
          color: var(--primary-dark) !important;
      }

      .nav-link {
          color: #ddd !important;
          font-weight: 500;
          transition: color 0.3s;
      }

      .nav-link:hover {
          color: var(--primary) !important;
      }

      footer {
          background-color: #1a1a1a;
          border-top: 2px solid var(--primary);
          padding: 3rem 0 1.5rem;
          margin-top: 5rem;
      }

      footer h5 {
          color: var(--primary);
          font-weight: 600;
      }

      footer p {
          color: #e0e0e0;
      }

      footer a {
          color: #e0e0e0;
          text-decoration: none;
          transition: color 0.3s;
      }

      footer a:hover {
          color: var(--primary);
      }

      footer ul {
          list-style: none;
          padding: 0;
      }

      footer li {
          margin-bottom: 0.5rem;
      }

      .content-wrapper {
          min-height: calc(100vh - 200px);
          padding-top: 2rem;
      }

      .support-banner {
          background-color: #dc3545;
          color: white;
          padding: 1rem;
          text-align: center;
          font-size: 0.95rem;
          position: sticky;
          top: 0;
          z-index: 1050;
          width: 100%;
      }

      .support-banner a {
          color: white;
          text-decoration: underline;
          font-weight: 500;
      }

      .support-banner a:hover {
          color: #f8f9fa;
      }

      @media (max-width: 768px) {
          .support-banner {
              font-size: 0.85rem;
              padding: 0.75rem;
              position: relative;
          }
      }

      {% block extra_css %}{% endblock %}
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="/">The Dojo Bay</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/faq">FAQ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/disclaimer">Disclaimer</a>
            </li>
            <li class="nav-item">
              {% if session_paynym %}
              <a
                class="nav-link d-flex align-items-center gap-2"
                href="/add-dojo/dashboard"
              >
                <img
                  src="{{ session_paynym_avatar }}"
                  alt="PayNym"
                  style="
                    width: 28px;
                    height: 28px;
                    border-radius: 50%;
                    object-fit: cover;
                    border: 2px solid var(--primary);
                  "
                  onerror="this.style.display = 'none'"
                />
                <span>My Dojos</span>
              </a>
              {% else %}
              <a class="nav-link" href="/add-dojo">
                <i class="bi bi-plus-circle me-1"></i>Add Your Dojo
              </a>
              {% endif %}
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Content -->
    <div class="content-wrapper">{% block content %}{% endblock %}</div>

    <!-- Footer -->
    <footer>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 text-center mb-4">
            <p>
              <a
                href="http://dojobay.pw"
                target="_blank"
                style="font-size: 1.1rem; margin-right: 2rem"
              >
                <i class="bi bi-globe2"></i> dojobay.pw
              </a>
              <a
                href="http://dojobayswp3qv5iwamualgzlv6faenb5me677wcs3detwmjcfv3ja7ad.onion/"
                target="_blank"
                style="font-size: 1.1rem"
              >
                <i class="bi bi-incognito"></i> Onion URL
              </a>
            </p>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
